name: Release Swift SDK

on:
  repository_dispatch:
    types: [erika-release]
  workflow_dispatch:
    inputs:
      version:
        description: liberika version to release
        required: true
        type: string
      checksum:
        description: SwiftPM checksum for the liberika binary archive
        required: true
        type: string
      source_tag:
        description: liberika source release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: erika-swift-release-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Update and release Swift package
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      CHECKSUM: ${{ github.event.client_payload.checksum || inputs.checksum }}
      SOURCE_TAG: ${{ github.event.client_payload.source_tag || inputs.source_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_TAG" == "v$VERSION" ]]
          curl --fail --silent --show-error --location --head \
            "https://github.com/AimesSoft/liberika/releases/download/${SOURCE_TAG}/erika-swift-core-${VERSION}.xcframework.zip" \
            > /dev/null

      - name: Update the SwiftPM binary target
        shell: bash
        run: |
          set -euo pipefail
          previous_version="$(sed -nE 's#.*releases/download/v([0-9.]+)/erika-swift-core-.*#\1#p' Package.swift)"
          [[ "$previous_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive_url="https://github.com/AimesSoft/liberika/releases/download/v${VERSION}/erika-swift-core-${VERSION}.xcframework.zip"
          sed -i '' -E \
            "s#url: \"https://github.com/AimesSoft/(Erika|liberika)/releases/download/v[0-9.]+/erika-swift-core-[0-9.]+\\.xcframework\\.zip\"#url: \"${archive_url}\"#" \
            Package.swift
          sed -i '' -E \
            "s/(checksum: \")[0-9a-f]+(\")/\\1${CHECKSUM}\\2/" \
            Package.swift
          # Sync docs from the package's actual previous version on every release.
          PREVIOUS_VERSION="$previous_version" python3 - <<'PYTHON'
          import os
          from pathlib import Path

          for name in ["README.md", "README.zh.md", "THIRD_PARTY_NOTICES.md", "Examples/Player/README.md"]:
              path = Path(name)
              path.write_text(path.read_text().replace(os.environ["PREVIOUS_VERSION"], os.environ["VERSION"]))
          PYTHON
          grep -Fq "${CHECKSUM}" Package.swift
          grep -Fq "erika-swift-core-${VERSION}.xcframework.zip" Package.swift

      - name: Validate and test the package
        run: |
          swift package dump-package
          swift test

      - name: Commit and tag the release
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift README.md README.zh.md THIRD_PARTY_NOTICES.md Examples/Player/README.md
          if git diff --cached --quiet; then
            echo "No package changes are required."
          else
            git commit -m "Release Erika Swift SDK v${VERSION}"
            git push origin HEAD:main
          fi

          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; release creation is complete."
            exit 0
          fi
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n' "Erika Swift SDK v${VERSION}" > "$notes"
          printf '%s\n' \
            "- 更新 liberika 核心二进制到 v${VERSION}" \
            "- 支持 macOS、iOS 和 tvOS 的 SwiftPM 集成" \
            "- 提供 UIKit、AppKit 和 SwiftUI 播放视图" \
            "- SwiftPM checksum: \`${CHECKSUM}\`" >> "$notes"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes-file "$notes"
